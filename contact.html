
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us | BuyBritish</title>
  <style>
    :root {
      --green: #143D2B;
      --cream: #F7F4EC;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--cream);
      color: #26352D;
      line-height: 1.7;
    }

    header, footer {
      background: var(--green);
      color: white;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .links {
      display: flex;
      gap: 24px;
    }

    .links a[aria-current="page"] {
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 56px 24px;
    }

    h1, h2 { color: var(--green); }

    .panel {
      background: white;
      padding: 28px;
      border-radius: 16px;
      margin-top: 24px;
    }

    .button {
      display: inline-block;
      background: var(--green);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      padding: 24px;
      margin-top: 32px;
    }

    @media (max-width: 600px) {
      nav { flex-direction: column; }
      main { padding: 32px 18px; }
    }
  </style>
</head>
<body>

<header>
  <nav aria-label="Main navigation">
    <a class="logo" href="index.html">🇬🇧 BuyBritish</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="about.html">About us</a>
      <a href="contact.html" aria-current="page">Contact us</a>
    </div>
  </nav>
</header>

<main>
  <h1>Contact us</h1>

  <section class="panel">
    <h2>Get in touch</h2>
    <p>
      Have a question, suggestion or interested in working with
      BuyBritish? We'd love to hear from you.
    </p>

    <p>
      Email us at:
      <strong>hello@buybritish.co</strong>
    </p>

    <a class="button" href="mailto:hello@buybritish.co">
      Email BuyBritish
    </a>
  </section>
</main>

<footer>
  <p>© 2026 BuyBritish</p>
  <p><a href="about.html">About us</a></p>
</footer>

</body>
</html>
